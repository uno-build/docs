<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PlayCanvas World Space + React + Uno UI</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?external=react",
          "react-reconciler": "https://esm.sh/react-reconciler@0.34.0?external=react",
          "react-reconciler/constants.js": "https://esm.sh/react-reconciler@0.34.0/constants.js",
          "playcanvas": "https://esm.sh/playcanvas@2.22.2",
          "yoga-layout/load": "https://esm.sh/yoga-layout@3.2.1/load",
          "@uno/ui/react": "./uno-ui/components/react/index.js",
          "@uno/ui/ResourcesWebGPU": "./uno-ui/renderer/webgpu/ResourcesWebGPU.js",
          "@uno/ui/UIPlayCanvas": "./uno-ui/ui/UIPlayCanvas.js"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script type="module">
      import * as PC from 'playcanvas'
      import ResourcesWebGPU from '@uno/ui/ResourcesWebGPU'
      import UIPlayCanvas from '@uno/ui/UIPlayCanvas'
      import { registerRootComponent } from '@uno/ui/react'
      import { getReactComponent } from './components/loaders.js'

      // PlayCanvas and Uno UI share the same canvas and WebGPU device.
      const canvas = document.querySelector('canvas')
      const graphics_device = await PC.createGraphicsDevice(canvas, {
        deviceTypes: ['webgpu'],
        antialias: true,
        alpha: true,
      })
      graphics_device.maxPixelRatio = window.devicePixelRatio
      const resources = await ResourcesWebGPU.create({
        canvas,
        device: graphics_device.wgpu,
        context: graphics_device.gpuContext,
        format: graphics_device.canvasConfig.format,
      })

      const app_options = new PC.AppOptions()
      app_options.graphicsDevice = graphics_device
      app_options.componentSystems = [PC.RenderComponentSystem, PC.CameraComponentSystem]
      app_options.resourceHandlers = [PC.TextureHandler, PC.ContainerHandler]
      const app = new PC.AppBase(canvas)
      app.init(app_options)
      app.setCanvasFillMode(PC.FILLMODE_FILL_WINDOW)
      app.setCanvasResolution(PC.RESOLUTION_AUTO)
      app.scene.ambientLight = new PC.Color(1, 1, 1)

      const UI_SIZE = 400
      const device_pixel_ratio = window.devicePixelRatio
      const { ui, plane, material } = await UIPlayCanvas.create({
        app,
        resources,
        device_pixel_ratio,
        texture_width: Math.round(UI_SIZE * device_pixel_ratio),
        texture_height: Math.round(UI_SIZE * device_pixel_ratio),
        world_width: 1,
        world_height: 1,
        // createPlane({ material, world_width, world_height }) {
        //   const geometry = new PC.BoxGeometry({
        //     halfExtents: new PC.Vec3(world_width / 2, world_height / 2, world_width / 2),
        //   })
        //   const body_material = new PC.StandardMaterial()
        //   body_material.diffuse = new PC.Color(245 / 255, 242 / 255, 236 / 255)
        //   body_material.useLighting = false
        //   body_material.useTonemap = false
        //   body_material.update()

        //   // BoxGeometry starts with the two triangles of the +Z face.
        //   const mesh = PC.Mesh.fromGeometry(graphics_device, geometry)
        //   mesh.primitive[0].count = 6
        //   const body_mesh = PC.Mesh.fromGeometry(graphics_device, geometry)
        //   body_mesh.primitive[0].base = 6
        //   body_mesh.primitive[0].count -= 6
        //   const mesh_instance = new PC.MeshInstance(mesh, material)
        //   const body_mesh_instance = new PC.MeshInstance(body_mesh, body_material)
        //   const plane = new PC.Entity('ui-box', app)
        //   plane.addComponent('render', {
        //     meshInstances: [mesh_instance, body_mesh_instance],
        //   })

        //   return {
        //     plane,
        //     geometry,
        //     mesh,
        //     mesh_instance,
        //     body_mesh,
        //     body_material,
        //     mapIntersection(intersection) {
        //       if (intersection.mesh_instance !== mesh_instance) return null
        //       // PlayCanvas UVs have V=0 at the top; Uno's mapper expects V=0 at the bottom.
        //       return { x: intersection.uv.x, y: 1 - intersection.uv.y }
        //     },
        //   }
        // },
      })
      // Match the unlit materials in the Three.js demo.
      material.useLighting = false
      material.specular.set(0, 0, 0)
      material.update()
      ui.setViewport(UI_SIZE, UI_SIZE)
      app.root.addChild(plane)

      const camera = new PC.Entity('camera', app)
      camera.addComponent('camera', {
        clearColor: new PC.Color(17 / 255, 24 / 255, 39 / 255),
        fov: 60,
        nearClip: 0.1,
        farClip: 100,
      })
      app.root.addChild(camera)
      ui.setCamera(camera)

      // Load the font and image used by components/React.jsx.
      const font_name = 'ChangaOne'
      const response_image = await fetch(`assets/${font_name}.png`)
      const blob = await response_image.blob()
      const image = await createImageBitmap(blob)
      const response_data = await fetch(`assets/${font_name}.json`)
      const data = await response_data.json()
      resources.registerFont(font_name, { image, data })

      const image_url = 'assets/coin.png'
      const response = await fetch(image_url)
      const coin_blob = await response.blob()
      const coin = await createImageBitmap(coin_blob)
      resources.registerImage(image_url, { image: coin })

      // Mount the same React component used earlier.
      const App = await getReactComponent('components/React.jsx')
      const react = registerRootComponent(App, { ui })
      react.render({ defaultName: 'PlayCanvas' })

      function onResize() {
        graphics_device.maxPixelRatio = window.devicePixelRatio
        app.resizeCanvas()
        camera.setPosition(0, 0, 3 / Math.min(canvas.clientWidth / canvas.clientHeight, 1))
      }
      window.addEventListener('resize', onResize)
      onResize()

      app.on('update', () => {
        plane.setLocalEulerAngles(0, Math.sin(performance.now() / 2000) * 0.8 * 180 / Math.PI, 0)
      })
      app.on('prerender', () => {
        ui.update()
        ui.draw({ submit: false, command_encoder: graphics_device.getCommandEncoder() })
      })
      app.start()
    </script>
  </body>
</html>
