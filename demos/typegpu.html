<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TypeGPU Cube + React + Uno UI</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?external=react",
          "react-reconciler": "https://esm.sh/react-reconciler@0.34.0?external=react",
          "react-reconciler/constants.js": "https://esm.sh/react-reconciler@0.34.0/constants.js",
          "typegpu": "https://esm.sh/typegpu@0.12.5",
          "typegpu/data": "https://esm.sh/typegpu@0.12.5/data",
          "yoga-layout/load": "https://esm.sh/yoga-layout@3.2.1/load",
          "@uno/ui/react": "./uno-ui/components/react/index.js",
          "@uno/ui/ResourcesWebGPU": "./uno-ui/renderer/webgpu/ResourcesWebGPU.js",
          "@uno/ui/UI": "./uno-ui/ui/UI.js"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script type="module">
      import tgpu from "typegpu";
      import * as d from "typegpu/data";
      import ResourcesWebGPU from "@uno/ui/ResourcesWebGPU";
      import UI from "@uno/ui/UI";
      import { registerRootComponent } from "@uno/ui/react";
      import { getReactComponent } from "./components/loaders.js";

      // TypeGPU and Uno UI share the same canvas and WebGPU device.
      const canvas = document.querySelector("canvas");
      const resources = await ResourcesWebGPU.create({ canvas });
      const { device, context, format } = resources;
      const root = tgpu.initFromDevice({ device });
      const { ui: background_ui } = await UI.create({ resources });
      const { ui: foreground_ui } = await UI.create({ resources });

      const frame_uniform = root.createUniform(d.vec2f); // Time and aspect ratio.

      // Generate the cube from eight corners and twelve triangles, without vertex buffers.
      const cube_vertex_fn = tgpu.vertexFn({
        in: { vertex_index: d.builtin.vertexIndex },
        out: { position: d.builtin.position, color: d.vec3f },
      })(`{
        let corners = array<vec3f, 8>(
          vec3f(-1, -1, -1), vec3f(1, -1, -1), vec3f(1, 1, -1), vec3f(-1, 1, -1),
          vec3f(-1, -1,  1), vec3f(1, -1,  1), vec3f(1, 1,  1), vec3f(-1, 1,  1),
        );
        let indices = array<u32, 36>(
          0, 3, 2, 0, 2, 1,  // Back
          4, 5, 6, 4, 6, 7,  // Front
          0, 4, 7, 0, 7, 3,  // Left
          1, 2, 6, 1, 6, 5,  // Right
          0, 1, 5, 0, 5, 4,  // Bottom
          3, 7, 6, 3, 6, 2,  // Top
        );
        let corner = corners[indices[in.vertex_index]];
        let c = cos(vec2f(frame.x * 0.5, frame.x));
        let s = sin(vec2f(frame.x * 0.5, frame.x));
        var p = vec3f(corner.x, c.x * corner.y - s.x * corner.z, s.x * corner.y + c.x * corner.z);
        p = vec3f(c.y * p.x + s.y * p.z, p.y, -s.y * p.x + c.y * p.z);
        let depth = 4.0 - p.z;
        return Out(vec4f(p.x * 1.4 / frame.y, p.y * 1.4, depth - 1.0, depth), corner * 0.5 + vec3f(0.5));
      }`).$uses({ frame: frame_uniform });

      const cube_fragment_fn = tgpu.fragmentFn({
        in: { color: d.vec3f },
        out: d.vec4f,
      })(`{
        return vec4f(in.color, 1.0);
      }`);

      // A single convex cube only needs back-face culling, so no depth texture is needed.
      const pipeline = root.createRenderPipeline({
        vertex: cube_vertex_fn,
        fragment: cube_fragment_fn,
        targets: { format },
        primitive: { topology: "triangle-list", cullMode: "back" },
      });

      // Load the font and images used by components/React.jsx and the background.
      const font_name = "ChangaOne";
      const response_image = await fetch(`assets/${font_name}.png`);
      const blob = await response_image.blob();
      const image = await createImageBitmap(blob);
      const response_data = await fetch(`assets/${font_name}.json`);
      const data = await response_data.json();
      resources.registerFont(font_name, { image, data });

      const image_url = "assets/coin.png";
      const response = await fetch(image_url);
      const coin_blob = await response.blob();
      const coin = await createImageBitmap(coin_blob);
      resources.registerImage(image_url, { image: coin });

      background_ui.root.style("backgroundImage", image_url);
      background_ui.root.style("backgroundSize", "32px 32px");
      background_ui.root.style("backgroundRepeat", "repeat");

      // Mount the same React component used earlier as the foreground UI.
      const App = await getReactComponent("components/React.jsx");
      const react = registerRootComponent(App, { ui: foreground_ui });
      react.render({ backgroundColor: '#F5F2EC99', defaultName: 'TypeGPU' });

      function onResize() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const device_pixel_ratio = window.devicePixelRatio;
        canvas.width = Math.max(1, Math.round(width * device_pixel_ratio));
        canvas.height = Math.max(1, Math.round(height * device_pixel_ratio));
        for (const ui of [background_ui, foreground_ui]) {
          ui.setViewport(width, height);
          ui.setDevicePixelRatio(device_pixel_ratio);
          ui.update();
        }
      }
      window.addEventListener("resize", onResize);
      onResize();

      let bgposition = 0;
      requestAnimationFrame(function render(time) {
        const canvas_texture = context.getCurrentTexture();
        const texture_view = canvas_texture.createView();

        bgposition += 0.25;
        background_ui.root.style("backgroundPosition", `${bgposition}px ${-bgposition}px`);
        background_ui.update();

        frame_uniform.write(d.vec2f(time / 1000, canvas.width / canvas.height));

        // Draw the background, TypeGPU cube, and React in one command buffer.
        const command_encoder = device.createCommandEncoder();
        background_ui.draw({ submit: false, command_encoder, texture_view, load_op: "clear" });
        pipeline
          .with(command_encoder)
          .withColorAttachment({ view: texture_view, loadOp: "load" })
          .draw(36);
        foreground_ui.update();
        foreground_ui.draw({ command_encoder, texture_view });

        requestAnimationFrame(render);
      });
    </script>
  </body>
</html>
