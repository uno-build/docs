<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Three.js World Space + React + Uno UI</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?external=react",
          "react-reconciler": "https://esm.sh/react-reconciler@0.34.0?external=react",
          "react-reconciler/constants.js": "https://esm.sh/react-reconciler@0.34.0/constants.js",
          "three/webgpu": "https://esm.sh/three@0.186.0/webgpu",
          "three/tsl": "https://esm.sh/three@0.186.0/tsl",
          "yoga-layout/load": "https://esm.sh/yoga-layout@3.2.1/load",
          "@uno/ui/react": "./uno-ui/components/react/index.js",
          "@uno/ui/ResourcesWebGPU": "./uno-ui/renderer/webgpu/ResourcesWebGPU.js",
          "@uno/ui/UIThree": "./uno-ui/ui/UIThree.js"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script type="module">
      import * as THREE from 'three/webgpu'
      import ResourcesWebGPU from '@uno/ui/ResourcesWebGPU'
      import UIThree from '@uno/ui/UIThree'
      import { registerRootComponent } from '@uno/ui/react'

      // Uno UI share the same canvas and WebGPU device.
      const canvas = document.querySelector('canvas')
      const resources = await ResourcesWebGPU.create({ canvas })
      const { device, context } = resources

      const UI_SIZE = 400
      const device_pixel_ratio = window.devicePixelRatio
      const { ui, plane } = await UIThree.create({
        resources,
        device_pixel_ratio,
        texture_width: Math.round(UI_SIZE * device_pixel_ratio),
        texture_height: Math.round(UI_SIZE * device_pixel_ratio),
        world_width: 1,
        world_height: 1,
        createMaterial: () => new THREE.MeshBasicNodeMaterial(),
        // createPlane({ material, world_width, world_height }) {
        //   const geometry = new THREE.BoxGeometry(world_width, world_height, 0.5)
        //   const body_material = new THREE.MeshBasicNodeMaterial({
        //     color: 0xf5f2ec,
        //   })

        //   const plane = new THREE.Mesh(geometry, [
        //     body_material,
        //     body_material,
        //     body_material,
        //     body_material,
        //     material,
        //     body_material,
        //   ])

        //   return {
        //     plane,
        //     geometry,
        //     body_material,
        //     mapIntersection(intersection) {
        //       return intersection.face?.materialIndex === 4 ? intersection.uv : null
        //     },
        //   }
        // },
      })
      ui.setViewport(UI_SIZE, UI_SIZE)

      // Three.js
      const renderer = new THREE.WebGPURenderer({ canvas, device, context })
      await renderer.init()
      const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 100)
      ui.setCamera(camera)
      const scene = new THREE.Scene()
      scene.add(plane)
      scene.background = new THREE.Color(0x111827)

      // Load the font and image used by components/React.jsx.
      const font_name = 'ChangaOne'
      const response_image = await fetch(`assets/${font_name}.png`)
      const blob = await response_image.blob()
      const image = await createImageBitmap(blob)
      const response_data = await fetch(`assets/${font_name}.json`)
      const data = await response_data.json()
      resources.registerFont(font_name, { image, data })

      const image_url = 'assets/coin.png'
      const response = await fetch(image_url)
      const coin_blob = await response.blob()
      const coin = await createImageBitmap(coin_blob)
      resources.registerImage(image_url, { image: coin })

      // Mount the same React component used earlier.
      const App = await getReactComponent('components/React.jsx')
      const react = registerRootComponent(App, { ui })
      react.render({})

      function onResize() {
        const width = canvas.clientWidth
        const height = canvas.clientHeight
        renderer.setPixelRatio(window.devicePixelRatio)
        renderer.setSize(width, height, false)
        camera.aspect = width / height
        camera.position.z = 3 / Math.min(camera.aspect, 1)
        camera.updateProjectionMatrix()
      }
      window.addEventListener('resize', onResize)
      onResize()

      requestAnimationFrame(function render(time) {
        plane.rotation.y = Math.sin(time / 2000) * 0.8

        ui.draw()
        renderer.render(scene, camera)

        requestAnimationFrame(render)
      })

      async function getReactComponent(filename) {
        const response = await fetch(new URL(filename, document.baseURI))
        if (!response.ok) throw new Error(`Failed to load ${filename}: ${response.status}`)
        const source = await response.text()
        const { code } = Babel.transform(source, {
          filename,
          presets: [['react', { runtime: 'automatic' }]],
        })
        const module_url = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }))
        try {
          const { default: Component } = await import(module_url)
          return Component
        } finally {
          URL.revokeObjectURL(module_url)
        }
      }
    </script>
  </body>
</html>
