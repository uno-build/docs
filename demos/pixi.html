<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixi.js Square + React + Uno UI</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?external=react",
          "react-reconciler": "https://esm.sh/react-reconciler@0.34.0?external=react",
          "react-reconciler/constants.js": "https://esm.sh/react-reconciler@0.34.0/constants.js",
          "pixi.js": "https://esm.sh/pixi.js@8.20.1",
          "yoga-layout/load": "https://esm.sh/yoga-layout@3.2.1/load",
          "@uno/ui/react": "./uno-ui/components/react/index.js",
          "@uno/ui/ResourcesWebGPU": "./uno-ui/renderer/webgpu/ResourcesWebGPU.js",
          "@uno/ui/UI": "./uno-ui/ui/UI.js"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script type="module">
      import { Container, Sprite, Texture, WebGPURenderer } from "pixi.js";
      import ResourcesWebGPU from "@uno/ui/ResourcesWebGPU";
      import UI from "@uno/ui/UI";
      import { registerRootComponent } from "@uno/ui/react";
      import { getReactComponent } from "./components/loaders.js";

      // Pixi.js and Uno UI share the same canvas, WebGPU adapter, and device.
      const canvas = document.querySelector("canvas");
      const adapter = await navigator.gpu.requestAdapter();
      const resources = await ResourcesWebGPU.create({ canvas, adapter });
      const { ui: background_ui } = await UI.create({ resources });
      const { ui: foreground_ui } = await UI.create({ resources });

      const renderer = new WebGPURenderer();
      await renderer.init({
        canvas,
        gpu: {
          adapter: resources.adapter,
          device: resources.device,
        },
        resolution: window.devicePixelRatio,
        backgroundAlpha: 0,
        clearBeforeRender: false,
        antialias: false,
        skipExtensionImports: true,
      });

      const stage = new Container();
      const square = new Sprite(createGradientTexture());
      square.anchor.set(0.5);
      stage.addChild(square);

      function createGradientTexture() {
        const size = 256;
        const pixels = new Uint8Array(size * size * 4);
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const index = (y * size + x) * 4;
            pixels[index] = (x / (size - 1)) * 255;
            pixels[index + 1] = (1 - y / (size - 1)) * 255;
            pixels[index + 2] = 255;
            pixels[index + 3] = 255;
          }
        }
        return Texture.from({
          resource: pixels,
          width: size,
          height: size,
          format: "rgba8unorm",
        });
      }

      // Load the font and images used by components/React.jsx and the background.
      const font_name = "ChangaOne";
      const response_image = await fetch(`assets/${font_name}.png`);
      const blob = await response_image.blob();
      const image = await createImageBitmap(blob);
      const response_data = await fetch(`assets/${font_name}.json`);
      const data = await response_data.json();
      resources.registerFont(font_name, { image, data });

      const image_url = "assets/coin.png";
      const response = await fetch(image_url);
      const coin_blob = await response.blob();
      const coin = await createImageBitmap(coin_blob);
      resources.registerImage(image_url, { image: coin });

      background_ui.root.style("backgroundImage", image_url);
      background_ui.root.style("backgroundSize", "32px 32px");
      background_ui.root.style("backgroundRepeat", "repeat");

      // Mount the same React component used earlier as the foreground UI.
      const App = await getReactComponent("components/React.jsx");
      const react = registerRootComponent(App, { ui: foreground_ui });
      react.render({ backgroundColor: '#F5F2EC99', defaultName: 'Pixi.js' });

      function onResize() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        const device_pixel_ratio = window.devicePixelRatio;
        renderer.resize(width, height, device_pixel_ratio);

        const square_size = Math.min(width, height) * 0.5;
        square.position.set(width / 2, height / 2);
        square.width = square_size;
        square.height = square_size;

        for (const ui of [background_ui, foreground_ui]) {
          ui.setViewport(width, height);
          ui.setDevicePixelRatio(device_pixel_ratio);
          ui.update();
        }
      }
      window.addEventListener("resize", onResize);
      onResize();

      let bgposition = 0;
      requestAnimationFrame(function render(time) {
        bgposition += 0.25;
        background_ui.root.style("backgroundPosition", `${bgposition}px ${-bgposition}px`);
        background_ui.update();

        square.rotation = time / 1000;

        // Draw the background repeating coins, then the Pixi.js square, then React on top.
        background_ui.draw({ load_op: "clear" });
        renderer.render({ container: stage, clear: false });
        foreground_ui.draw();

        requestAnimationFrame(render);
      });
    </script>
  </body>
</html>
