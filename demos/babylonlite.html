<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Babylon Lite Cube + React + Uno UI</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?external=react",
          "react-reconciler": "https://esm.sh/react-reconciler@0.34.0?external=react",
          "react-reconciler/constants.js": "https://esm.sh/react-reconciler@0.34.0/constants.js",
          "@babylonjs/lite": "https://cdn.jsdelivr.net/npm/@babylonjs/lite@1.29.0/lib/index.js",
          "yoga-layout/load": "https://esm.sh/yoga-layout@3.2.1/load",
          "@uno/ui/react": "./uno-ui/components/react/index.js",
          "@uno/ui/ResourcesWebGPU": "./uno-ui/renderer/webgpu/ResourcesWebGPU.js",
          "@uno/ui/UI": "./uno-ui/ui/UI.js"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script type="module">
      import {
        addTask,
        addToScene,
        createBoxData,
        createEngine,
        createFreeCamera,
        createMeshFromData,
        createRenderTarget,
        createRenderTask,
        createSceneContext,
        createStandardMaterial,
        enableMaterialPlugins,
        onBeforeRender,
        registerScene,
        renderFrame,
        resizeEngine,
      } from "@babylonjs/lite";
      import ResourcesWebGPU from "@uno/ui/ResourcesWebGPU";
      import UI from "@uno/ui/UI";
      import { registerRootComponent } from "@uno/ui/react";
      import { getReactComponent } from "./components/loaders.js";

      // Babylon Lite and Uno UI share the same canvas and WebGPU device.
      const canvas = document.querySelector("canvas");
      const engine = await createEngine(canvas, {
        msaaSamples: 1,
        alphaMode: "premultiplied",
      });
      // Explicit tasks keep the background, cube, and foreground in order.
      const scene = createSceneContext(engine, { defaultRenderTask: false });
      const resources = await ResourcesWebGPU.create({
        canvas,
        device: engine._device,
        context: canvas.getContext("webgpu"),
        format: engine.format,
      });
      const { ui: background_ui } = await UI.create({ resources });
      const { ui: foreground_ui } = await UI.create({ resources });

      const camera = createFreeCamera({ x: 0, y: 0, z: -2.5 }, { x: 0, y: 0, z: 0 });
      camera.fov = Math.PI / 3;
      camera.nearPlane = 0.1;
      camera.farPlane = 10;
      scene.camera = camera;

      const box_data = createBoxData(1);
      const cube = createMeshFromData(
        engine,
        "cube",
        box_data.positions,
        box_data.normals,
        box_data.indices,
        box_data.uvs,
      );
      const material = createStandardMaterial();
      material.disableLighting = true;
      // Match the view-space normal colors used in babylon.html.
      material.plugins = [{
        name: "normal-material",
        getCustomCode(shader_type) {
          if (shader_type === "vertex") return null;
          return {
            CUSTOM_FRAGMENT_BEFORE_FRAGCOLOR: `
              let viewNormal = normalize((scene.view * vec4<f32>(input.vn, 0.0)).xyz);
              // Convert Lite's left-handed view to the original right-handed view.
              let normal = viewNormal * vec3<f32>(1.0, 1.0, -1.0);
              color = vec4<f32>(normal * 0.5 + vec3<f32>(0.5), 1.0);
            `,
          };
        },
      }];
      cube.material = material;
      addToScene(scene, cube);

      // Load the font and images used by components/React.jsx and the background.
      const font_name = "ChangaOne";
      const response_image = await fetch(`assets/${font_name}.png`);
      const blob = await response_image.blob();
      const image = await createImageBitmap(blob);
      const response_data = await fetch(`assets/${font_name}.json`);
      const data = await response_data.json();
      resources.registerFont(font_name, { image, data });

      const image_url = "assets/coin.png";
      const response = await fetch(image_url);
      const coin_blob = await response.blob();
      const coin = await createImageBitmap(coin_blob);
      resources.registerImage(image_url, { image: coin });

      background_ui.root.style("backgroundImage", image_url);
      background_ui.root.style("backgroundSize", "32px 32px");
      background_ui.root.style("backgroundRepeat", "repeat");

      // Mount the same React component used earlier as the foreground UI.
      const App = await getReactComponent("components/React.jsx");
      const react = registerRootComponent(App, { ui: foreground_ui });
      react.mount({ backgroundColor: "#F5F2EC99", defaultName: "Babylon Lite" });

      function onResize() {
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        resizeEngine(engine);
        for (const ui of [background_ui, foreground_ui]) {
          ui.setViewport(width, height);
          ui.setDevicePixelRatio(window.devicePixelRatio);
          ui.update();
        }
      }
      window.addEventListener("resize", onResize);
      onResize();

      let bgposition = 0;
      onBeforeRender(scene, () => {
        const time = performance.now();
        bgposition += 0.25;
        background_ui.root.style("backgroundPosition", `${bgposition}px ${-bgposition}px`);
        background_ui.update();
        cube.rotation.x = time / 2000;
        cube.rotation.y = time / 1000;
      });

      addTask(scene, {
        name: "background-ui",
        engine,
        _passes: [],
        record() {},
        execute() {
          background_ui.draw({
            submit: false,
            command_encoder: engine._currentEncoder,
            texture_view: engine.scRT._colorView,
            load_op: "clear",
          });
          return 1;
        },
        dispose() {},
      });

      // Preserve the Uno background while clearing depth for the cube.
      const depth = createRenderTarget({
        lbl: "scene-depth",
        dFormat: "depth24plus-stencil8",
        samples: 1,
        size: engine,
      });
      addTask(scene, createRenderTask({ name: "scene", rt: engine.scRT, depth, clr: false }, engine, scene));

      addTask(scene, {
        name: "foreground-ui",
        engine,
        _passes: [],
        record() {},
        execute() {
          foreground_ui.draw({
            submit: false,
            command_encoder: engine._currentEncoder,
            texture_view: engine.scRT._colorView,
          });
          return 1;
        },
        dispose() {},
      });

      enableMaterialPlugins(scene);
      await registerScene(scene);

      let last_time = 0;
      requestAnimationFrame(function render(time) {
        const delta = last_time === 0 ? 0 : time - last_time;
        last_time = time;
        renderFrame(engine, delta);
        requestAnimationFrame(render);
      });
    </script>
  </body>
</html>
