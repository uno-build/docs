<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "vue": "https://esm.sh/vue@^3.5.42?target=es2022",
          "vue/compiler-sfc": "https://esm.sh/@vue/compiler-sfc@3.5.42/dist/compiler-sfc.esm-browser.js?raw",
          "yoga-layout/load": "https://esm.sh/yoga-layout@3.2.1/load",
          "@uno.build/ui/": "https://esm.sh/@uno.build/ui@0.1.0/"
        }
      }
    </script>
    <script type="module">
      import ResourcesWebGPU from '@uno.build/ui/ResourcesWebGPU'
      import UI from '@uno.build/ui/UI'
      import { registerRootComponent } from '@uno.build/ui/vue'
      import { loadVueComponent } from './components/loaders.js'

      const canvas = document.querySelector('canvas')
      const resources = await ResourcesWebGPU.create({ canvas })
      const { ui } = await UI.create({ resources })

      // Font
      const font_name = 'ChangaOne'
      const response_image = await fetch(`assets/${font_name}.png`)
      const blob = await response_image.blob()
      const image = await createImageBitmap(blob)
      const response_data = await fetch(`assets/${font_name}.json`)
      const data = await response_data.json()
      resources.registerFont(font_name, { image, data })

      // Image
      const image_url = 'assets/coin.png'
      const response = await fetch(image_url)
      const coin_blob = await response.blob()
      const coin = await createImageBitmap(coin_blob)
      resources.registerImage(image_url, { image: coin })

      // Vue
      const App = await loadVueComponent('components/Vue.vue') // import App from './components/Vue.vue'
      const vue = registerRootComponent(App, { ui })
      vue.mount({})

      function onResize() {
        canvas.width = canvas.clientWidth * window.devicePixelRatio
        canvas.height = canvas.clientHeight * window.devicePixelRatio
        ui.setViewport(canvas.clientWidth, canvas.clientHeight)
        ui.setDevicePixelRatio(window.devicePixelRatio)
        ui.update()
      }
      window.addEventListener('resize', onResize)
      onResize()

      requestAnimationFrame(function render() {
        ui.draw()
        requestAnimationFrame(render)
      })
    </script>
  </body>
</html>
