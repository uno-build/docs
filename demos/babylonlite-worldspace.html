<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Babylon Lite World Space + React + Uno UI</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.3.0",
          "react/jsx-runtime": "https://esm.sh/react@19.3.0/jsx-runtime?external=react",
          "react-reconciler": "https://esm.sh/react-reconciler@0.34.0?external=react",
          "react-reconciler/constants.js": "https://esm.sh/react-reconciler@0.34.0/constants.js",
          "@babylonjs/lite": "https://cdn.jsdelivr.net/npm/@babylonjs/lite@1.29.0/lib/index.js",
          "yoga-layout/load": "https://esm.sh/yoga-layout@3.2.1/load",
          "@uno/ui/react": "./uno-ui/components/react/index.js",
          "@uno/ui/ResourcesWebGPU": "./uno-ui/renderer/webgpu/ResourcesWebGPU.js",
          "@uno/ui/UIBabylonLite": "./uno-ui/ui/UIBabylonLite.js"
        }
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
    <script type="module">
      import {
        addToScene,
        createBoxData,
        createEngine,
        createFreeCamera,
        createMeshFromData,
        createSceneContext,
        createStandardMaterial,
        enableMaterialPlugins,
        getPickedUV,
        onBeforeRender,
        registerScene,
        renderFrame,
        resizeEngine,
      } from '@babylonjs/lite'
      import ResourcesWebGPU from '@uno/ui/ResourcesWebGPU'
      import UIBabylonLite from '@uno/ui/UIBabylonLite'
      import { registerRootComponent } from '@uno/ui/react'
      import { getReactComponent } from './components/loaders.js'

      // Babylon Lite and Uno UI share the same canvas and WebGPU device.
      const canvas = document.querySelector('canvas')
      const engine = await createEngine(canvas, {
        msaaSamples: 1,
        alphaMode: 'premultiplied',
      })
      const scene = createSceneContext(engine)
      scene.clearColor = { r: 17 / 255, g: 24 / 255, b: 39 / 255, a: 1 }
      const resources = await ResourcesWebGPU.create({
        canvas,
        device: engine._device,
        context: canvas.getContext('webgpu'),
        format: engine.format,
      })

      const UI_SIZE = 400
      const device_pixel_ratio = window.devicePixelRatio
      const { ui, plane } = await UIBabylonLite.create({
        engine,
        scene,
        resources,
        device_pixel_ratio,
        texture_width: Math.round(UI_SIZE * device_pixel_ratio),
        texture_height: Math.round(UI_SIZE * device_pixel_ratio),
        world_width: 1,
        world_height: 1,
        createMaterial() {
          const material = createStandardMaterial()
          material.disableLighting = true
          material.emissiveColor = [1, 1, 1]
          return material
        },
        // createPlane({ material, world_width, world_height }) {
        //   const box_data = createBoxData({
        //     width: world_width,
        //     height: world_height,
        //     depth: world_width,
        //   })
        //   // Keep the -Z face UVs; mark the other five faces for the solid body color.
        //   for (let vertex = 0; vertex < box_data.vertexCount; vertex++) {
        //     if (vertex < 4 || vertex >= 8) box_data.uvs[vertex * 2] = -1
        //   }
        //   const plane = createMeshFromData(
        //     engine,
        //     'ui-box',
        //     box_data.positions,
        //     box_data.normals,
        //     box_data.indices,
        //     box_data.uvs,
        //   )
        //   material.plugins.push({
        //     name: 'ui-box-body',
        //     getCustomCode(shader_type) {
        //       if (shader_type === 'vertex') return null
        //       return {
        //         CUSTOM_FRAGMENT_BEFORE_FRAGCOLOR: `
        //           if (input.vu.x < 0.0) {
        //             color = vec4<f32>(245.0 / 255.0, 242.0 / 255.0, 236.0 / 255.0, 1.0);
        //           }
        //         `,
        //       }
        //     },
        //   })
        //   plane.material = material

        //   return {
        //     plane,
        //     mapIntersection(intersection) {
        //       // The two triangles of the -Z face face the camera.
        //       if (intersection.faceId !== 2 && intersection.faceId !== 3) return null
        //       const uv = getPickedUV(intersection)
        //       return uv === null ? null : { x: uv[0], y: uv[1] }
        //     },
        //   }
        // },
      })
      ui.setViewport(UI_SIZE, UI_SIZE)
      addToScene(scene, plane)

      const camera = createFreeCamera({ x: 0, y: 0, z: -3 }, { x: 0, y: 0, z: 0 })
      camera.fov = Math.PI / 3
      camera.nearPlane = 0.1
      camera.farPlane = 100
      scene.camera = camera
      ui.setCamera(camera)

      // Load the font and image used by components/React.jsx.
      const font_name = 'ChangaOne'
      const response_image = await fetch(`assets/${font_name}.png`)
      const blob = await response_image.blob()
      const image = await createImageBitmap(blob)
      const response_data = await fetch(`assets/${font_name}.json`)
      const data = await response_data.json()
      resources.registerFont(font_name, { image, data })

      const image_url = 'assets/coin.png'
      const response = await fetch(image_url)
      const coin_blob = await response.blob()
      const coin = await createImageBitmap(coin_blob)
      resources.registerImage(image_url, { image: coin })

      // Mount the same React component used earlier.
      const App = await getReactComponent('components/React.jsx')
      const react = registerRootComponent(App, { ui })
      react.render({ defaultName: 'Babylon Lite' })

      function onResize() {
        resizeEngine(engine)
        camera.position.z = -3 / Math.min(canvas.clientWidth / canvas.clientHeight, 1)
      }
      window.addEventListener('resize', onResize)
      onResize()

      onBeforeRender(scene, () => {
        plane.rotation.y = Math.sin(performance.now() / 2000) * 0.8
        ui.draw({ submit: false, command_encoder: engine._currentEncoder })
      })
      enableMaterialPlugins(scene)
      await registerScene(scene)

      let last_time = 0
      requestAnimationFrame(function render(time) {
        const delta = last_time === 0 ? 0 : time - last_time
        last_time = time
        renderFrame(engine, delta)
        requestAnimationFrame(render)
      })
    </script>
  </body>
</html>
